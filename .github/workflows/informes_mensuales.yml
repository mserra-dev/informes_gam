name: Informes Mensuales GAM — El Litoral

on:
  # Corre el 1ro de cada mes a las 11:30 AM (Argentina = UTC-3 → 14:30 UTC)
  schedule:
    - cron: "30 14 1 * *"

  # Permite correrlo manualmente desde GitHub → Actions → Run workflow
  workflow_dispatch:
    inputs:
      informe:
        description: "Informe a generar"
        required: true
        default: "todos"
        type: choice
        options:
          - todos
          - pautas
          - bloques
          - programatica
          - prevision
      sitios:
        description: "[prevision] Sitios separados por coma"
        required: false
        default: "notife,radio,radiorafaela,puerto,puertonegocios,sur24"
        type: string
      tamano:
        description: "[prevision] Tamaño ANCHOxALTO"
        required: false
        default: "300x250"
        type: string
      dias:
        description: "[prevision] Duración en días"
        required: false
        default: "30"
        type: string
      inicio:
        description: "[prevision] Inicio YYYY-MM-DD (vacío = desde ahora)"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: read

jobs:
  generar-informes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Clonar el repositorio ─────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Configurar Python ─────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ── 3. Instalar dependencias ─────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Escribir credenciales del service account ─────────────
      #    El secret GAM_SA_JSON_B64 contiene el JSON del service account
      #    codificado en base64. Se decodifica y escribe a un archivo temporal.
      - name: Write service account credentials
        run: |
          echo "${{ secrets.GAM_SA_JSON_B64 }}" | base64 --decode > /tmp/gam_sa.json
        shell: bash

      # ── 5. Ejecutar el script de informes ────────────────────────
      - name: Run informes
        env:
          GAM_SA_PATH: /tmp/gam_sa.json
          PREVISION_OUTPUT_DIR: ${{ runner.temp }}/prevision
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INFORME="${{ github.event.inputs.informe }}"
          else
            INFORME="todos"
          fi

          case "$INFORME" in
            pautas)       python informe_mensual_gam.py --pautas ;;
            bloques)      python informe_mensual_gam.py --bloques ;;
            programatica) python informe_mensual_gam.py --programatica ;;
            prevision)
              ARGS=(--sitios "${{ github.event.inputs.sitios }}"
                    --tamano "${{ github.event.inputs.tamano }}"
                    --dias   "${{ github.event.inputs.dias }}")
              if [ -n "${{ github.event.inputs.inicio }}" ]; then
                ARGS+=(--inicio "${{ github.event.inputs.inicio }}")
              fi
              python prevision_disponibilidad.py "${ARGS[@]}" ;;
            *)            python informe_mensual_gam.py ;;
          esac

      # ── 6. Limpiar credenciales ───────────────────────────────────
      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/gam_sa.json

      # ── 6b. Resultado de la previsión (solo informe=prevision) ────
      - name: Upload previsión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prevision-disponibilidad
          path: ${{ runner.temp }}/prevision/
          if-no-files-found: ignore

      # ── 7. Keepalive ──────────────────────────────────────────────
      #    GitHub desactiva los crons tras 60 días sin actividad en el
      #    repo (disabled_inactivity; pasó el 2026-08-01). Re-habilitar
      #    el workflow en cada corrida resetea ese contador.
      - name: Keepalive del cron
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/informes_mensuales.yml/enable
